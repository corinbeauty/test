<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>太空射擊 - 完整擴充版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #050510;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    box-shadow: 0 0 50px rgba(0, 150, 255, 0.25);
  }
  canvas {
    display: block;
    background: #000;
    border: 2px solid #1a3a5c;
  }
  #ui {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 16px;
    line-height: 1.6;
    text-shadow: 0 0 8px #00aaff;
    pointer-events: none;
    z-index: 10;
  }
  #boss-bar {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 18px;
    background: #333;
    border: 2px solid #ff4444;
    border-radius: 4px;
    display: none;
    z-index: 10;
  }
  #boss-hp {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff2222, #ff8800);
    transition: width 0.2s;
  }
  #boss-label {
    position: absolute;
    top: -22px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #ff6666;
  }
  /* 觸控按鈕 */
  #touch-controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
    z-index: 20;
  }
  .touch-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(0, 150, 255, 0.25);
    border: 2px solid rgba(0, 180, 255, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    pointer-events: auto;
    user-select: none;
  }
  #btn-left, #btn-right { font-size: 32px; }
  #btn-shoot {
    background: rgba(255, 100, 0, 0.3);
    border-color: rgba(255, 150, 0, 0.7);
  }
  /* 畫面覆蓋層 */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 30;
  }
  .screen h1 {
    font-size: 42px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #00ccff, #0066ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .screen p { font-size: 16px; color: #aaa; line-height: 1.7; margin-bottom: 24px; }
  button {
    padding: 12px 36px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    margin: 6px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: scale(1.05); }
  #start-btn { background: linear-gradient(135deg, #00cc88, #009966); }
  #restart-btn { background: linear-gradient(135deg, #00aaff, #0066cc); }
  #leaderboard-btn { background: linear-gradient(135deg, #aa66ff, #6644cc); }
  #back-btn { background: #444; }
  #name-input {
    padding: 10px 16px;
    font-size: 18px;
    border-radius: 6px;
    border: 2px solid #00aaff;
    background: #111;
    color: white;
    margin-bottom: 16px;
    width: 220px;
    text-align: center;
  }
  #leaderboard-list {
    list-style: none;
    width: 280px;
    margin: 16px 0 24px;
    text-align: left;
  }
  #leaderboard-list li {
    padding: 8px 12px;
    background: rgba(255,255,255,0.05);
    margin-bottom: 6px;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="ui">
      分數: <span id="score">0</span><br>
      生命: <span id="lives">❤️❤️❤️</span><br>
      <span id="power-status"></span>
    </div>

    <div id="boss-bar">
      <div id="boss-label">BOSS</div>
      <div id="boss-hp"></div>
    </div>

    <!-- 觸控控制 -->
    <div id="touch-controls">
      <div style="display:flex; gap:12px;">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="touch-btn" id="btn-shoot">🔥</div>
    </div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="screen">
      <h1>🚀 太空射擊</h1>
      <p>
        ← → / A D 移動　空白鍵發射<br>
        消滅敵人掉落道具　達到分數召喚 Boss<br>
        支援手機觸控操作
      </p>
      <button id="start-btn">開始遊戲</button>
      <button id="leaderboard-btn">排行榜</button>
    </div>

    <!-- 遊戲結束 -->
    <div id="game-over" class="screen hidden">
      <h1>遊戲結束</h1>
      <p>最終分數: <span id="final-score">0</span></p>
      <input type="text" id="name-input" placeholder="輸入名字 (最多6字)" maxlength="6">
      <div>
        <button id="save-score-btn">儲存分數</button>
        <button id="restart-btn">再玩一次</button>
      </div>
    </div>

    <!-- 排行榜 -->
    <div id="leaderboard-screen" class="screen hidden">
      <h1>🏆 排行榜</h1>
      <ul id="leaderboard-list"></ul>
      <button id="back-btn">返回</button>
    </div>
  </div>

<script>
/* ========== 音效系統 (Web Audio API) ========== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, type, duration, volume = 0.1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function sfxShoot() { playTone(880, 'square', 0.08, 0.08); }
function sfxHit() { playTone(200, 'sawtooth', 0.15, 0.12); }
function sfxExplosion() { playTone(80, 'sawtooth', 0.3, 0.15); }
function sfxPower() { playTone(660, 'sine', 0.25, 0.12); playTone(990, 'sine', 0.2, 0.08); }
function sfxBoss() { playTone(120, 'triangle', 0.4, 0.15); }
function sfxHurt() { playTone(150, 'square', 0.25, 0.15); }

/* 簡單背景音樂 (循環低音) */
let bgOsc = null, bgGain = null;
function startBGM() {
  if (!audioCtx || bgOsc) return;
  bgOsc = audioCtx.createOscillator();
  bgGain = audioCtx.createGain();
  bgOsc.type = 'sine';
  bgOsc.frequency.value = 55;
  bgGain.gain.value = 0.03;
  bgOsc.connect(bgGain);
  bgGain.connect(audioCtx.destination);
  bgOsc.start();
}
function stopBGM() {
  if (bgOsc) {
    bgOsc.stop();
    bgOsc = null;
    bgGain = null;
  }
}

/* ========== 遊戲變數 ========== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameRunning = false;
let score = 0;
let lives = 3;
let keys = {};
let stars = [];
let bullets = [];
let enemies = [];
let particles = [];
let powerups = [];
let boss = null;
let enemySpawnTimer = 0;
let enemySpawnInterval = 80;
let frame = 0;
let nextBossScore = 1500;
let doubleShot = false;
let doubleShotTimer = 0;
let shield = false;
let shieldTimer = 0;
let shootCooldown = 0;

const player = {
  x: canvas.width / 2 - 25,
  y: canvas.height - 80,
  width: 50,
  height: 40,
  speed: 6
};

/* ========== 初始化 ========== */
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.4,
      speed: Math.random() * 1.8 + 0.4
    });
  }
}

function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 800;
}

/* ========== 繪圖 ========== */
function drawStars() {
  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.6 + Math.random() * 0.4;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
    s.y += s.speed;
    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  });
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

  // 護盾
  if (shield) {
    ctx.beginPath();
    ctx.arc(0, 0, 38, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0, 255, 200, ${0.4 + Math.sin(frame * 0.15) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // 船身
  ctx.fillStyle = '#00ccff';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00ccff';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(24, 20);
  ctx.lineTo(8, 12);
  ctx.lineTo(-8, 12);
  ctx.lineTo(-24, 20);
  ctx.closePath();
  ctx.fill();

  // 引擎火焰
  ctx.shadowBlur = 0;
  ctx.fillStyle = `hsl(${30 + Math.random() * 20}, 100%, 55%)`;
  ctx.beginPath();
  ctx.moveTo(-9, 12);
  ctx.lineTo(0, 26 + Math.random() * 10);
  ctx.lineTo(9, 12);
  ctx.fill();

  ctx.restore();
}

function drawBullets() {
  ctx.fillStyle = '#ffff00';
  ctx.shadowBlur = 12;
  ctx.shadowColor = '#ffff00';
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    ctx.fillRect(b.x, b.y, b.width, b.height);
    b.y -= b.speed;
    if (b.y < -20) bullets.splice(i, 1);
  }
  ctx.shadowBlur = 0;
}

function drawEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    ctx.save();
    ctx.translate(e.x + e.width / 2, e.y + e.height / 2);
    ctx.rotate(frame * 0.03);
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = e.color;
    ctx.beginPath();
    for (let j = 0; j < 6; j++) {
      const a = (j / 6) * Math.PI * 2;
      ctx.lineTo(Math.cos(a) * e.width / 2, Math.sin(a) * e.width / 2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    e.y += e.speed;
    if (e.y > canvas.height + 40) enemies.splice(i, 1);
  }
  ctx.shadowBlur = 0;
}

function drawBoss() {
  if (!boss) return;
  const b = boss;
  ctx.save();
  ctx.translate(b.x + b.width / 2, b.y + b.height / 2);
  ctx.rotate(Math.sin(frame * 0.02) * 0.1);

  // 身體
  ctx.fillStyle = '#ff2244';
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#ff0000';
  ctx.beginPath();
  ctx.moveTo(0, -b.height / 2);
  ctx.lineTo(b.width / 2, 0);
  ctx.lineTo(b.width / 3, b.height / 2);
  ctx.lineTo(-b.width / 3, b.height / 2);
  ctx.lineTo(-b.width / 2, 0);
  ctx.closePath();
  ctx.fill();

  // 眼睛
  ctx.fillStyle = '#ffff00';
  ctx.beginPath();
  ctx.arc(-15, -10, 8, 0, Math.PI * 2);
  ctx.arc(15, -10, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
  ctx.shadowBlur = 0;

  // 移動
  b.x += b.vx;
  if (b.x <= 0 || b.x + b.width >= canvas.width) b.vx *= -1;
  b.y += Math.sin(frame * 0.03) * 0.8;

  // 發射
  if (frame % 40 === 0) {
    enemies.push({
      x: b.x + b.width / 2 - 15,
      y: b.y + b.height,
      width: 30,
      height: 30,
      speed: 3.5,
      color: '#ff6600'
    });
  }
}

function drawPowerups() {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    ctx.save();
    ctx.translate(p.x + 15, p.y + 15);
    ctx.rotate(frame * 0.05);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.icon, 0, 0);
    ctx.restore();

    p.y += 2.2;
    if (p.y > canvas.height) powerups.splice(i, 1);
  }
  ctx.shadowBlur = 0;
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

/* ========== 邏輯 ========== */
function shoot() {
  if (shootCooldown > 0) return;
  shootCooldown = doubleShot ? 8 : 14;
  sfxShoot();

  const cx = player.x + player.width / 2;
  bullets.push({ x: cx - 3, y: player.y, width: 6, height: 16, speed: 13 });
  if (doubleShot) {
    bullets.push({ x: cx - 18, y: player.y + 8, width: 5, height: 12, speed: 12 });
    bullets.push({ x: cx + 12, y: player.y + 8, width: 5, height: 12, speed: 12 });
  }
}

function spawnEnemy() {
  const size = 28 + Math.random() * 22;
  enemies.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    speed: 2 + Math.random() * 2.2 + Math.floor(score / 800) * 0.4,
    color: `hsl(${Math.random() * 50 + 10}, 85%, 55%)`
  });
}

function spawnBoss() {
  boss = {
    x: canvas.width / 2 - 60,
    y: 60,
    width: 120,
    height: 80,
    hp: 40 + Math.floor(score / 1000) * 15,
    maxHp: 40 + Math.floor(score / 1000) * 15,
    vx: 2.5
  };
  document.getElementById('boss-bar').style.display = 'block';
  updateBossBar();
  sfxBoss();
}

function updateBossBar() {
  if (!boss) return;
  const pct = Math.max(0, boss.hp / boss.maxHp * 100);
  document.getElementById('boss-hp').style.width = pct + '%';
}

function createExplosion(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 9,
      vy: (Math.random() - 0.5) * 9,
      life: 25 + Math.random() * 20,
      size: 2 + Math.random() * 3,
      color
    });
  }
}

function dropPowerup(x, y) {
  if (Math.random() > 0.28) return;
  const types = [
    { type: 'double', icon: '⚡', color: '#00ffaa' },
    { type: 'shield', icon: '🛡', color: '#00ccff' },
    { type: 'bomb', icon: '💣', color: '#ff6600' }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  powerups.push({ x, y, width: 30, height: 30, ...t });
}

function activatePower(type) {
  sfxPower();
  if (type === 'double') {
    doubleShot = true;
    doubleShotTimer = 420; // 約7秒
  } else if (type === 'shield') {
    shield = true;
    shieldTimer = 360;
  } else if (type === 'bomb') {
    // 清場
    enemies.forEach(e => createExplosion(e.x + e.width/2, e.y + e.height/2, e.color));
    enemies = [];
    if (boss) {
      boss.hp -= 12;
      updateBossBar();
      createExplosion(boss.x + 60, boss.y + 40, '#ff0000', 20);
      if (boss.hp <= 0) defeatBoss();
    }
    score += 200;
  }
  updatePowerStatus();
}

function updatePowerStatus() {
  let text = '';
  if (doubleShot) text += '⚡雙倍射擊 ';
  if (shield) text += '🛡護盾';
  document.getElementById('power-status').textContent = text;
}

function defeatBoss() {
  createExplosion(boss.x + 60, boss.y + 40, '#ff0000', 40);
  sfxExplosion();
  score += 800;
  document.getElementById('score').textContent = score;
  boss = null;
  document.getElementById('boss-bar').style.display = 'none';
  nextBossScore = score + 1800 + Math.floor(Math.random() * 500);
}

function checkCollisions() {
  // 子彈 vs 敵人
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (b.x < e.x + e.width && b.x + b.width > e.x &&
          b.y < e.y + e.height && b.y + b.height > e.y) {
        createExplosion(e.x + e.width/2, e.y + e.height/2, e.color);
        sfxHit();
        dropPowerup(e.x, e.y);
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        score += 100;
        document.getElementById('score').textContent = score;
        break;
      }
    }
  }

  // 子彈 vs Boss
  if (boss) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.x < boss.x + boss.width && b.x + b.width > boss.x &&
          b.y < boss.y + boss.height && b.y + b.height > boss.y) {
        bullets.splice(i, 1);
        boss.hp--;
        createExplosion(b.x, b.y, '#ffaa00', 5);
        sfxHit();
        updateBossBar();
        if (boss.hp <= 0) defeatBoss();
      }
    }
  }

  // 玩家 vs 敵人
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (player.x < e.x + e.width && player.x + player.width > e.x &&
        player.y < e.y + e.height && player.y + player.height > e.y) {
      createExplosion(e.x + e.width/2, e.y + e.height/2, e.color);
      enemies.splice(i, 1);
      if (shield) {
        shield = false;
        shieldTimer = 0;
        sfxPower();
      } else {
        lives--;
        sfxHurt();
        updateLives();
        if (lives <= 0) endGame();
      }
      updatePowerStatus();
    }
  }

  // 玩家 vs Boss
  if (boss && player.x < boss.x + boss.width && player.x + player.width > boss.x &&
      player.y < boss.y + boss.height && player.y + player.height > boss.y) {
    if (shield) {
      shield = false;
      shieldTimer = 0;
    } else {
      lives--;
      sfxHurt();
      updateLives();
      if (lives <= 0) endGame();
    }
    // 把玩家推開一點
    player.y = Math.min(player.y + 40, canvas.height - 80);
    updatePowerStatus();
  }

  // 玩家 vs 道具
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    if (player.x < p.x + p.width && player.x + player.width > p.x &&
        player.y < p.y + p.height && player.y + player.height > p.y) {
      activatePower(p.type);
      powerups.splice(i, 1);
    }
  }
}

function updatePlayer() {
  if ((keys['ArrowLeft'] || keys['a'] || keys['A'] || keys.touchLeft) && player.x > 0)
    player.x -= player.speed;
  if ((keys['ArrowRight'] || keys['d'] || keys['D'] || keys.touchRight) && player.x < canvas.width - player.width)
    player.x += player.speed;
}

function updateLives() {
  document.getElementById('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
}

function updateTimers() {
  if (shootCooldown > 0) shootCooldown--;
  if (doubleShotTimer > 0) {
    doubleShotTimer--;
    if (doubleShotTimer <= 0) {
      doubleShot = false;
      updatePowerStatus();
    }
  }
  if (shieldTimer > 0) {
    shieldTimer--;
    if (shieldTimer <= 0) {
      shield = false;
      updatePowerStatus();
    }
  }
}

/* ========== 主迴圈 ========== */
function gameLoop() {
  if (!gameRunning) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStars();
  updatePlayer();
  drawPlayer();
  drawBullets();
  drawEnemies();
  drawBoss();
  drawPowerups();
  drawParticles();
  checkCollisions();
  updateTimers();

  // 生成敵人
  if (!boss) {
    enemySpawnTimer++;
    if (enemySpawnTimer >= enemySpawnInterval) {
      spawnEnemy();
      enemySpawnTimer = 0;
      enemySpawnInterval = Math.max(28, 80 - Math.floor(score / 400) * 4);
    }
  }

  // Boss 觸發
  if (!boss && score >= nextBossScore) {
    spawnBoss();
  }

  frame++;
  requestAnimationFrame(gameLoop);
}

/* ========== 遊戲流程 ========== */
function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startBGM();

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over').classList.add('hidden');
  document.getElementById('leaderboard-screen').classList.add('hidden');
  document.getElementById('boss-bar').style.display = 'none';

  score = 0;
  lives = 3;
  bullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  boss = null;
  doubleShot = false;
  shield = false;
  doubleShotTimer = 0;
  shieldTimer = 0;
  enemySpawnTimer = 0;
  enemySpawnInterval = 80;
  nextBossScore = 1500;
  player.x = canvas.width / 2 - 25;
  frame = 0;

  document.getElementById('score').textContent = '0';
  updateLives();
  updatePowerStatus();

  if (isMobile()) {
    document.getElementById('touch-controls').style.display = 'flex';
  }

  gameRunning = true;
  gameLoop();
}

function endGame() {
  gameRunning = false;
  stopBGM();
  document.getElementById('final-score').textContent = score;
  document.getElementById('game-over').classList.remove('hidden');
  document.getElementById('touch-controls').style.display = 'none';
  document.getElementById('name-input').value = '';
}

/* ========== 排行榜 ========== */
function getLeaderboard() {
  try {
    return JSON.parse(localStorage.getItem('spaceShooterLB') || '[]');
  } catch {
    return [];
  }
}

function saveScore() {
  const name = document.getElementById('name-input').value.trim() || '無名英雄';
  let list = getLeaderboard();
  list.push({ name: name.substring(0, 6), score });
  list.sort((a, b) => b.score - a.score);
  list = list.slice(0, 5);
  localStorage.setItem('spaceShooterLB', JSON.stringify(list));
  showLeaderboard();
}

function showLeaderboard() {
  const list = getLeaderboard();
  const ul = document.getElementById('leaderboard-list');
  ul.innerHTML = '';
  if (list.length === 0) {
    ul.innerHTML = '<li style="justify-content:center">尚無紀錄</li>';
  } else {
    list.forEach((item, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>#${i + 1} \( {item.name}</span><span> \){item.score}</span>`;
      ul.appendChild(li);
    });
  }
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over').classList.add('hidden');
  document.getElementById('leaderboard-screen').classList.remove('hidden');
}

/* ========== 事件 ========== */
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && gameRunning) {
    e.preventDefault();
    shoot();
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

// 觸控
function bindTouch(btn, key) {
  const el = document.getElementById(btn);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; if (key === 'touchShoot') shoot(); });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('touchcancel', e => { e.preventDefault(); keys[key] = false; });
}
bindTouch('btn-left', 'touchLeft');
bindTouch('btn-right', 'touchRight');
bindTouch('btn-shoot', 'touchShoot');

// 按鈕
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('save-score-btn').addEventListener('click', saveScore);
document.getElementById('leaderboard-btn').addEventListener('click', showLeaderboard);
document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('leaderboard-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
});

// 初始化
initStars();
</script>
</body>
</html>
